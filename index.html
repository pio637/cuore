<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello di Controllo - Marianna</title>
    <!-- Importiamo Tailwind CSS per la grafica -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animazioni personalizzate per il cuore e le particelle */
        @keyframes heartbeat-slow {
            0%, 100% { transform: scale(1); opacity: 0.6; filter: drop-shadow(0 0 10px rgba(148, 163, 184, 0.5)); }
            50% { transform: scale(1.05); opacity: 0.8; filter: drop-shadow(0 0 20px rgba(148, 163, 184, 0.8)); }
        }
        
        @keyframes heartbeat-fast {
            0% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.8)); }
            15% { transform: scale(1.15); filter: drop-shadow(0 0 40px rgba(244, 63, 94, 1)); }
            30% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.8)); }
            45% { transform: scale(1.15); filter: drop-shadow(0 0 40px rgba(244, 63, 94, 1)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.8)); }
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        .animate-heart-slow { animation: heartbeat-slow 3s ease-in-out infinite; }
        .animate-heart-fast { animation: heartbeat-fast 1.2s ease-in-out infinite; }

        .particle {
            position: absolute;
            bottom: -10%;
            animation: float-up 5s ease-in forwards;
            pointer-events: none;
            color: rgba(251, 113, 133, 0.6);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        /* Utility per il fade in */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
    </style>
</head>
<body class="m-0 overflow-hidden text-slate-200 antialiased font-sans">

    <!-- Sfondo principale -->
    <div id="app-container" class="relative min-h-screen flex items-center justify-center p-4 transition-all duration-[3000ms] ease-in-out bg-gradient-to-br from-slate-950 via-slate-900 to-cyan-950">
        
        <!-- Contenitore particelle (cuoricini che volano) -->
        <div id="particles-container" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

        <!-- Pannello di Vetro Centrale -->
        <div class="glass-panel relative z-10 w-full max-w-lg rounded-3xl p-8 sm:p-12 flex flex-col items-center text-center overflow-hidden transition-all duration-1000">
            
            <!-- Intestazione -->
            <div class="w-full flex justify-between items-center mb-10 text-white/50 text-xs font-mono tracking-widest uppercase">
                <span class="flex items-center gap-2">
                    <!-- Icona Activity -->
                    <svg id="icon-activity" class="text-cyan-500 transition-colors duration-1000" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    ID: MARIANNA_01
                </span>
                <span>V 2.0.0</span>
            </div>

            <!-- Grafica Cuore -->
            <div class="relative mb-10">
                <!-- Aura luminosa dietro il cuore -->
                <div id="heart-glow" class="absolute inset-0 rounded-full blur-3xl transition-all duration-[2000ms] bg-cyan-500/10 opacity-50"></div>
                
                <!-- Icona Cuore -->
                <svg id="main-heart" class="relative transition-all duration-1000 text-slate-400 animate-heart-slow" width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
                </svg>
            </div>

            <!-- Testo di Stato -->
            <div class="h-24 flex flex-col justify-center transition-all duration-500">
                <h2 id="status-title" class="text-2xl sm:text-3xl font-bold tracking-tight mb-2 text-slate-200 transition-colors">
                    Risparmio Emotivo
                </h2>
                <p id="status-subtitle" class="text-sm font-medium tracking-widest uppercase transition-colors duration-1000 text-cyan-500/80">
                    STATO: ATTIVO
                </p>
            </div>

            <!-- Descrizione -->
            <p id="status-desc" class="mt-4 mb-10 text-white/70 text-sm sm:text-base font-light leading-relaxed max-w-xs mx-auto transition-all">
                I protocolli di difesa limitano l'energia emotiva per prevenire ferite al sistema centrale.
            </p>

            <!-- Pulsante di Sblocco -->
            <button id="unlock-btn" class="group relative overflow-hidden rounded-full font-semibold tracking-wide text-sm sm:text-base px-8 py-4 transition-all duration-300 bg-white/10 text-white hover:bg-white/20 border border-white/20 hover:border-white/50">
                <div class="flex items-center gap-3">
                    <!-- Icona Lucchetto Chiuso -->
                    <svg id="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:scale-110 transition-transform">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span id="btn-text">DISINSTALLA PAURE</span>
                </div>
            </button>

            <!-- Messaggio di Successo (Nascosto all'inizio) -->
            <div id="success-msg" class="hidden items-center gap-2 text-rose-100 animate-fade-in-up">
                <svg class="text-amber-300" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.28 1.28L3 12l5.8 1.9a2 2 0 0 1 1.28 1.28L12 21l1.9-5.8a2 2 0 0 1 1.28-1.28L21 12l-5.8-1.9a2 2 0 0 1-1.28-1.28Z"></path></svg>
                <span class="font-medium text-lg">Pronta per vivere al 100%</span>
                <svg class="text-amber-300" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.28 1.28L3 12l5.8 1.9a2 2 0 0 1 1.28 1.28L12 21l1.9-5.8a2 2 0 0 1 1.28-1.28L21 12l-5.8-1.9a2 2 0 0 1-1.28-1.28Z"></path></svg>
            </div>
        </div>
    </div>

    <!-- Script Logica Javascript -->
    <script>
        const btn = document.getElementById('unlock-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const container = document.getElementById('app-container');
        const iconActivity = document.getElementById('icon-activity');
        const heartGlow = document.getElementById('heart-glow');
        const mainHeart = document.getElementById('main-heart');
        const statusTitle = document.getElementById('status-title');
        const statusSubtitle = document.getElementById('status-subtitle');
        const statusDesc = document.getElementById('status-desc');
        const successMsg = document.getElementById('success-msg');
        const particlesContainer = document.getElementById('particles-container');

        let particleInterval;

        btn.addEventListener('click', () => {
            // FASE 1: Caricamento
            btnText.innerText = 'DISATTIVAZIONE IN CORSO...';
            
            // Cambia l'icona in un lucchetto che si apre
            btnIcon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>';
            btnIcon.classList.remove('group-hover:scale-110');
            btnIcon.classList.add('animate-pulse');
            
            // Stile pulsante "in attesa"
            btn.classList.add('bg-cyan-900/50', 'text-cyan-300', 'border-cyan-500/30', 'cursor-wait');
            btn.classList.remove('bg-white/10', 'hover:bg-white/20', 'border-white/20', 'hover:border-white/50');
            
            // Il cuore inizia a battere in modo irregolare
            mainHeart.classList.remove('text-slate-400', 'animate-heart-slow');
            mainHeart.classList.add('text-cyan-300', 'animate-pulse');

            // FASE 2: Sblocco emotivo (dopo 1.5 secondi)
            setTimeout(() => {
                // Nascondi pulsante e mostra messaggio di successo
                btn.style.display = 'none';
                successMsg.classList.remove('hidden');
                successMsg.classList.add('flex');

                // Cambia lo sfondo da freddo a caldo/romantico
                container.classList.remove('from-slate-950', 'via-slate-900', 'to-cyan-950');
                container.classList.add('from-fuchsia-800', 'via-rose-500', 'to-amber-500');

                // Cambia colori icone
                iconActivity.classList.remove('text-cyan-500');
                iconActivity.classList.add('text-rose-300');

                // Accendi l'aura del cuore
                heartGlow.classList.remove('bg-cyan-500/10', 'opacity-50');
                heartGlow.classList.add('bg-rose-500/50', 'opacity-100');

                // Fai battere forte il cuore e riempilo di colore
                mainHeart.classList.remove('text-cyan-300', 'animate-pulse');
                mainHeart.classList.add('text-rose-500', 'animate-heart-fast');
                mainHeart.setAttribute('fill', 'currentColor');
                mainHeart.setAttribute('stroke-width', '0');

                // Aggiorna i testi
                statusTitle.innerText = 'Libertà Totale';
                statusTitle.classList.remove('text-slate-200');
                statusTitle.classList.add('text-white', 'drop-shadow-md');

                statusSubtitle.innerText = 'SISTEMA SBLOCCATO';
                statusSubtitle.classList.remove('text-cyan-500/80');
                statusSubtitle.classList.add('text-amber-200', 'drop-shadow');

                statusDesc.innerText = 'Tutti i firewall difensivi sono stati rimossi. Nessun limite alla capacità di sentire, sorridere e amare.';
                
                // Avvia i cuoricini che volano verso l'alto
                startParticles();
            }, 1500);
        });

        // Funzione per generare particelle (cuoricini)
        function startParticles() {
            particleInterval = setInterval(() => {
                // Rimuove particelle vecchie per non appesantire il browser
                if (particlesContainer.children.length > 30) {
                    particlesContainer.removeChild(particlesContainer.firstChild);
                }
                
                // Crea un nuovo cuore SVG
                const heart = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                heart.setAttribute('viewBox', '0 0 24 24');
                heart.setAttribute('fill', 'currentColor');
                heart.setAttribute('class', 'particle');
                
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', 'M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z');
                heart.appendChild(path);

                // Posizione, grandezza e velocità casuali
                const size = Math.random() * 20 + 10;
                heart.style.left = Math.random() * 100 + '%';
                heart.style.width = size + 'px';
                heart.style.height = size + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.animationDelay = (Math.random() * 1) + 's';

                particlesContainer.appendChild(heart);
            }, 300);
        }
    </script>
</body>
</html>
